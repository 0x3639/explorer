services:
  testnet-explorer:
    build:
      context: .
    image: zenon-testnet-explorer:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    expose:
      - "80"
    networks:
      - root_proxy-net
    labels:
      - "caddy=${EXPLORER_HOST:-explorer.testnet.zenon.info}"
      - "caddy.encode=zstd gzip"
      - "caddy.reverse_proxy={{upstreams 80}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/index.html || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1

networks:
  root_proxy-net:
    name: root_proxy-net
    external: true
